# ============================================================
# 마스터 설정 파일 — 모든 스크립트는 숫자를 여기서만 읽습니다.
# 값을 바꾸면 데이터가 달라지므로, 바꿀 때는 꼭 커밋 메시지에 이유를 적으세요.
# ============================================================

# ---- 시드 (계획서 1.2) ----
seeds:
  val500: 1234        # 검증 500문항 층화 추출
  aux_eval: 2026      # AI2D / POPE 추출
  d1_audit: 7         # D1 수작업 검수 50쌍 추출
  train: [0, 1, 2]    # 학습 세트 표집 및 학습 실행

# ---- 데이터셋 ----
datasets:
  scienceqa:
    repo: derek-thomas/ScienceQA   # train/validation/test 모두 있는 원본 (이미지 있는 문항만 골라 씀)
    config: null
    splits: {train: train, validation: validation, test: test}
  ai2d:
    repo: lmms-lab/ai2d      # 처음 실행 때 이름이 맞는지 확인
    split: test
    n: 1000
  pope:
    repo: lmms-lab/POPE
    split: test
    n_per_category: 500
    categories: [random, adversarial]

val_n: 500

# ---- 모델 ----
# revision: Hugging Face 모델 페이지 > Files and versions > 최신 커밋 해시를 복사해서 붙여넣기
#           (null이면 최신 버전을 쓰는데, 재현성을 위해 꼭 채우세요)
models:
  smolvlm:
    id: HuggingFaceTB/SmolVLM-500M-Instruct
    revision: 753c1752602b5e739af7a7fa6947a635051897a3   # 2026-11-20 코랩에서 고정
    longest_edge: 1024      # 이미지 크기 제한(속도 조절용). null = 기본값
  qwen:
    id: Qwen/Qwen2.5-VL-3B-Instruct
    revision: null
    max_pixels: 401408      # 512*28*28, 이미지 토큰 수 제한

# ---- 난이도 측정 ----
scoring:
  batch_size: 4
  save_every: 50            # 배치 50개마다 중간 저장(코랩 끊김 대비)

# ---- 관문 A 기준 ----
gate_a:
  a1_margin_over_chance: 0.10
  a2_max_acc: 0.85
  a3_min_spearman: 0.5
  a4_min_items_per_bin: 1600

# ---- 학습 세트 ----
trainsets:
  n_max: 1200
  smolvlm:
    conditions: [Rand, D1, D2, D3, D4, D5, Full]
    sizes: [100, 200, 400, 800, 1200]
  qwen:
    conditions: [Rand, D1, D3, D5]
    sizes: [200, 1200]

# ---- 2단계에서 확정한 정답 글자 형식 (학습 타깃·채점에 동일 적용) ----
letter_format:
  smolvlm: space

# ---- 3단계-B: 같은 문제, 다른 오답 (문항 일치 설계) ----
matched:
  min_K: 3
  conditions: ['Hard', 'Easy', 'Rand', 'Full']
  sizes: [100, 200, 400, 800, 1200]
  n_max: 1200

# ============================================================
# 4단계: 파일럿 / 본실험 학습 설정 (파일럿 실행 가이드 4장)
# ============================================================
paths:
  runs_dir: /kaggle/working/runs   # Kaggle 로컬 디스크 (환경변수 HN_RUNS_DIR로 바꿀 수 있음)

train:
  precision: fp16          # T4: 모델 본체 fp16, LoRA fp32, autocast fp16 + GradScaler
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_regex: '^(?!.*(vision_model|connector)).*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$'
  lr_candidates: [5.0e-5, 1.0e-4, 2.0e-4]
  lr: 2.0e-4               # 파일럿 B2에서 확정 (코랩 P1~P3, 2026-11-20)
  micro_batch: 4           # 한 번에 GPU에 올리는 문항 수
  grad_accum: 4            # 실효 배치 = 4 x 4 = 16
  min_steps: 150           # 최대 step = max(150, ceil(4N/16))
  epochs_equiv: 4
  warmup_ratio: 0.05
  warmup_min_steps: 10
  eval_every: 25
  patience: 4              # 검증 4번 연속 개선 없으면 조기 종료
  max_grad_norm: 1.0
  max_length: 2048         # 넘는 문항이 있으면 자르지 않고 멈춤
  eval_batch: 8
  diverge_drop: 0.05       # 최고 검증 정확도 < 무학습 - 5%p 이면 발산

pilot:
  zs_ref_acc: 0.642        # 2단계 val500 무학습 정확도 (C1 비교값)
  c1_tolerance: 0.005
  tie_items: 2             # 학습률 1등과 2문항 이내면 작은 학습률
  b1_margin: 0.02
  b4_min_disagree: 0.05
  b4_noise_ratio: 2        # Hard-Easy 불일치율이 반복 실행(P4-P7) 불일치율의 2배 이상이어야 함
  test_eval_factor: 8      # test+AI2D+POPE 평가 시간 ~ val500 채점 시간 x 8
  b5_warn_diff: 0.01
  platform_warn_diff: 0.01  # 코랩 P3 vs Kaggle P3K 정확도 차이가 1%p 넘으면 경고
  b6_min_letter_rate: 0.95
  runs:                    # 파일럿 실행 가이드 5장
    P1: {trainset: trainsets/smolvlm_matched/Rand_N400_s0.jsonl,  lr: 5.0e-5}
    P2: {trainset: trainsets/smolvlm_matched/Rand_N400_s0.jsonl,  lr: 1.0e-4}
    P3: {trainset: trainsets/smolvlm_matched/Rand_N400_s0.jsonl,  lr: 2.0e-4}
    P3K: {trainset: trainsets/smolvlm_matched/Rand_N400_s0.jsonl, lr: chosen}   # Kaggle 환경 확인용 P3 재실행
    P4: {trainset: trainsets/smolvlm_matched/Rand_N1200_s0.jsonl, lr: chosen}
    P5: {trainset: trainsets/smolvlm_matched/Hard_N1200_s0.jsonl, lr: chosen}
    P6: {trainset: trainsets/smolvlm_matched/Easy_N1200_s0.jsonl, lr: chosen}
    P7: {trainset: trainsets/smolvlm_matched/Rand_N1200_s0.jsonl, lr: chosen}

# ============================================================
# 5단계: 본실험 (본실험 실행 설계서). 사전 등록(prereg-v1) 뒤에는 바꾸지 않음
# ============================================================
experiment:
  repo_url: https://github.com/naha0106-tech/hard-negative-mllm.git
  branch: itkyoung0606-pilot-ing     # main에 합치지 않고 이 브랜치를 계속 씀
  code_ref: prereg-v1                # 세션 노트북이 불러오는 태그 (스모크만 branch 사용)
  expected_env:                      # 다르면 본 세션은 시작하지 않음 (스모크는 경고만)
    torch: 2.11.0+cu130
    transformers: 4.51.3
    peft: 0.15.2
    gpu: Tesla T4
  pilot_env_torch: 2.11.0+cu130      # P3K를 돌린 torch. 지금 환경이 이것과 같을 때만 재사용
  reuse:                             # 본실험 run_id: 파일럿 run 폴더 이름 (Input에서 찾음)
    smolvlm_main-Rand_N400_s0: pilot_P3K_Rand_N400_lr2e-4
  main:
    trainset_dir: trainsets/smolvlm_matched
    conditions: [Hard, Easy, Rand, Full]
    sizes: [100, 200, 400, 800, 1200]
    eval_sets: [scienceqa, ai2d, pope]
    perm_sizes: [100, 1200]          # 순환 순열 정확도는 N 100·1,200과 무학습만
  aux:
    trainset_dir: trainsets/smolvlm
    conditions: [Rand, D1, D2, D3, D4, D5, Full]
    sizes: [100, 1200]
    eval_sets: [scienceqa]
  zs_eval_sets: [val, scienceqa, ai2d, pope]
  ece_bins: 10
  order_seed: 777                    # 같은 N 안에서 조건 순서를 섞는 시드
  time_budget_h: 10.5                # 이 시간 안에 끝날 실행만 시작 (Kaggle 12시간 제한 대비)
  start_margin: 1.2                  # 남은 시간 >= 예상 시간 x 1.2 일 때만 시작
  est_min:                           # 실행 1개 예상 시간(분). 세션 안에서 실측으로 보정
    train: {150: 29, 200: 39, 300: 58}
    eval_full: 20                    # test + AI2D + POPE
    eval_perm_extra: 21              # test 순환 순열 추가분
    eval_test_only: 10               # 보조 실험 (test만)
    eval_zs_val: 3                   # 무학습 val500
  smoke:
    max_steps: 10
    eval_every: 5
    val_limit: 50                    # 스모크 학습 중 검증 문항 수
    eval_limit: 50                   # 스모크 평가 세트별 문항 수
